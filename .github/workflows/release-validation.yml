name: release validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    uses: MCEnvision/.github/.github/workflows/release-validation.yml@6d0c74f3413b972312584b12d729ef9c24ce3fa5
    with:
      shared-ref: "6d0c74f3413b972312584b12d729ef9c24ce3fa5"
