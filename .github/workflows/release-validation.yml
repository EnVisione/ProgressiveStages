name: release validation

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate-release:
    name: release validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: build release
        run: |
          npm --prefix editor-ui ci --ignore-scripts --no-audit --no-fund
          npm --prefix editor-ui run build
          git diff --exit-code -- src/main/resources/assets/progressivestages/editor
          ./gradlew clean build --no-daemon --console=plain
      - name: validate artifact and checksum
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          artifact="build/libs/progressivestages-$version.jar"
          test -s "$artifact"
          jar tf "$artifact" | grep -E '^assets/progressivestages/editor/index.html$'
          javap -classpath "$artifact" com.enviouse.progressivestages.common.api.ProgressiveStagesAPI |
            grep -E 'grantStageFromSourceWithDependencyBypass'
          mkdir -p release-validation
          sha256sum "$artifact" > release-validation/SHA256SUMS
      - name: verify signed annotated tag
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_oid=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_oid" --jq '.object.sha')" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_oid" --jq '.verification.verified')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_oid" --jq '.tag')" = "$GITHUB_REF_NAME"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build/libs
          format: spdx-json
          output-file: release-validation/release.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        if: ${{ github.event.repository.visibility == 'public' }}
        with:
          subject-path: build/libs/progressivestages-*.jar
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        if: ${{ github.event.repository.visibility == 'public' }}
        with:
          subject-path: build/libs/progressivestages-*.jar
          sbom-path: release-validation/release.spdx.json
      - name: verify attestations and reject tampering
        if: ${{ github.event.repository.visibility == 'public' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          artifact="build/libs/progressivestages-$version.jar"
          signer="$GITHUB_REPOSITORY/.github/workflows/release-validation.yml"
          gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" --source-digest "$GITHUB_SHA"
          cp "$artifact" "$RUNNER_TEMP/tampered-release.jar"
          printf x >> "$RUNNER_TEMP/tampered-release.jar"
          if gh attestation verify "$RUNNER_TEMP/tampered-release.jar" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" --source-digest "$GITHUB_SHA"; then
            echo 'tampered release artifact unexpectedly verified' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-release-${{ github.sha }}
          path: |
            build/libs/progressivestages-*.jar
            release-validation/**
          if-no-files-found: error
          retention-days: 30
